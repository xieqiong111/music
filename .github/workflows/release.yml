# 多平台桌面打包:macOS(DMG)/ Windows(NSIS+MSI)/ Android(aarch64 debug APK)。
# 手动触发(workflow_dispatch);产物上传为 run artifacts。
# 不做代码签名(macOS ad-hoc、Android debug key、Windows 无证书),不创建 Release。
# 所有第三方 action 以已通过 GitHub API 核对的 commit SHA 固定(核对方式同 ci.yml)。
name: Desktop Release Bundles
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-macos:
    name: desktop bundle (macos · dmg)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Rust (stable, minimal profile)
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build macOS bundle (.app + .dmg, ad-hoc signed)
        run: pnpm --filter @playlist-exporter/desktop build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  desktop-windows:
    name: desktop bundle (windows · nsis+msi)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Rust (stable, minimal profile)
        shell: pwsh
        run: |
          Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable --profile minimal
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundles (NSIS + MSI, unsigned)
        run: pnpm --filter @playlist-exporter/desktop build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  desktop-android:
    name: desktop bundle (android · aarch64 debug apk)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17 (Gradle)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK 27.2
        run: sdkmanager --install "ndk;27.2.12479018" > /dev/null

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Rust (stable) + Android target + cargo-ndk
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project (tauri android init)
        run: pnpm --filter @playlist-exporter/desktop exec tauri android init

      - name: Build Android debug APK (aarch64, debug-signed)
        run: pnpm --filter @playlist-exporter/desktop exec tauri android build --apk --debug --target aarch64

      - name: Upload Android artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
