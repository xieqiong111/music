# 持续集成：安装（frozen lockfile）、类型检查、单元测试、双端构建、Playwright E2E、
# gitleaks 密钥扫描与生产依赖审计。
#
# 说明：
# - pnpm 版本不写死在此文件中：pnpm/action-setup 会读取根 package.json 的
#   packageManager 字段（pnpm@11.19.0），保持单一来源。
# - 所有第三方 action 均以 commit SHA 固定（注释中标注对应 tag），
#   SHA 已于 2026-09-04 通过 GitHub API 核对。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支/PR 的新推送会取消仍在运行的旧 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：所有 job 仅需要读取代码。
permissions:
  contents: read

jobs:
  # 主验证矩阵：Node 22/24 × Ubuntu/Windows/macOS。
  # Node 22 仅用于捕获对 Node 24+ API 的意外依赖（根 engines.node >=24）。
  verify:
    name: verify (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@1bd1e32a3bdc45362d676188d43c1b0d3ada9e57 # v4.2.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @playlist-exporter/web build

      - name: Build server
        run: pnpm --filter @playlist-exporter/server build

  # 浏览器端到端测试：仅 Ubuntu + Node 24（与开发环境一致）。
  # webServer 由 apps/web/playwright.config.ts 提供：自动构建并 vite preview 到 127.0.0.1:4321。
  e2e:
    name: e2e (ubuntu · node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@1bd1e32a3bdc45362d676188d43c1b0d3ada9e57 # v4.2.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @playlist-exporter/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm --filter @playlist-exporter/web e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # 安全检查：gitleaks 全历史密钥扫描 + 生产依赖高危漏洞审计。
  security:
    name: security (gitleaks + pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # GITLEAKS_LICENSE 仅 GitHub 组织账号需要（secrets 中未配置时为空，
      # 个人仓库免费使用，无需设置）。
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Install pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
