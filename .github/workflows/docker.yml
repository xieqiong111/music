# Docker 镜像多架构构建验证：linux/amd64 + linux/arm64。
#
# 本阶段仅构建、不推送：push 显式为 false，镜像发布（registry 凭证、tag 策略、
# 最新版指针）属于后续发布阶段的工作，启用时再补充。
# 另有 smoke job：构建 amd64 镜像 → 实际运行容器 → 执行 scripts/docker-smoke.mjs
# 的健康检查、令牌与 Origin 白名单、API 校验层矩阵（全部合成数据，不访问真实平台），
# 并用合成环境变量校验 docker compose config（令牌值不打印进日志）。
name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/docker-smoke.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/docker-smoke.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build image (amd64 + arm64, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # Dockerfile 属于 NAS Docker 阶段的交付物；在其合入之前本步骤自动跳过，
      # 保证该 workflow 不会因文件缺失而红灯。
      - name: Build image (amd64 + arm64, push disabled)
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 显式不推送：镜像发布流程在后续阶段再开启（届时需配置 registry 与凭证）。
          push: false
          tags: playlist-exporter:ci

  # 受限运行时验证：构建 amd64 镜像 → 实际运行容器 → 执行 smoke 检查矩阵。
  # 仅使用合成令牌与合成 origin；不访问真实平台；不推送镜像、不上传产物。
  smoke:
    name: smoke (amd64, run container + API checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build amd64 image (local load, no push)
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: playlist-exporter:smoke

      # 校验 compose 文件可解析、插值与 YAML 合并正确。使用合成值且 --quiet 不打印
      # 配置内容（真实令牌绝不进入日志）。与任务单第 3 节的 docker compose config 对应。
      - name: Validate compose interpolation (synthetic values, quiet)
        run: |
          docker compose config --quiet
          echo "docker compose config: OK"

      - name: Setup Node 24 (for scripts/docker-smoke.mjs)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # 脚本自身会以受限配置运行容器（随机空闲端口 + 4319 默认端口两个场景），
      # 这里只跳过重复构建（镜像已在上方 load 到本地 Docker）。
      - name: Run Docker smoke (container + API check matrix)
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: node scripts/docker-smoke.mjs --skip-build --image playlist-exporter:smoke
